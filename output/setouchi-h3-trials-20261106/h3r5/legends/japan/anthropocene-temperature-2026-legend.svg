<svg xmlns="http://www.w3.org/2000/svg" width="44in" height="19.052559in" viewBox="0 0 44.0 19.052559" role="img" data-sheet-kind="legend" data-map-companion="anthropocene-temperature-2026.svg" data-atlas-presentation="msp-speculation-5-wine-amber" data-sheet-background="#240413" data-h3-resolution="5"><rect id="atlas-sheet-paper" width="44" height="19.052559" fill="#240413" data-presentation-only="true"/><title>Japan / anthropocene-temperature-2026 / legend</title><desc>Standalone legend. The matching cartographic and data sheet contains no legend.</desc><g id="legend-informatics" data-plate-ordinal="16" data-legend-style="setouchi-st2"><text x="0.27" y="-43.42" font-family="Atkinson Hyperlegible" font-size="0.7777777777777778" fill="#fcc553" font-weight="700" transform="rotate(90)" dominant-baseline="central" style="fill:#fcc553;stroke:none;stroke-opacity:0">Japan / Anthropocene</text><text x="0.27" y="-42.79" font-family="Atkinson Hyperlegible" font-size="0.7777777777777778" fill="#fcc553" font-weight="700" transform="rotate(90)" dominant-baseline="central" style="fill:#fcc553;stroke:none;stroke-opacity:0">New daily high records</text><text x="42.38" y="0.42" font-family="Atkinson Hyperlegible" font-size="0.3333333333333333" fill="#fcc553" text-anchor="end" font-weight="700" dominant-baseline="central" style="fill:#fcc553;stroke:none;stroke-opacity:0">Days per H3 cell / 2026 through 28 October</text><text x="42.38" y="0.88" font-family="Atkinson Hyperlegible" font-size="0.2222222222222222" fill="#fcc553" text-anchor="end" dominant-baseline="central" style="fill:#fcc553;stroke:none;stroke-opacity:0">Six Yellow–red count classes. Neutral observed cells: zero; blank: no valid sample</text><text x="42.38" y="1.24" font-family="Atkinson Hyperlegible" font-size="0.16666666666666666" fill="#fcc553" text-anchor="end" font-style="italic" dominant-baseline="central" style="fill:#fcc553;stroke:none;stroke-opacity:0">World dataset: 62,035 covered cells; NOAA CPC land-tempera