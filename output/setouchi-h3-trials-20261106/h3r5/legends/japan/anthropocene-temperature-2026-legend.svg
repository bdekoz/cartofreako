ate(-4.640000000000001 -0.9)"><rect x="4.400000" y="0.760000" width="0.480000" height="0.280000" style="fill:rgb(244,163,64); fill-opacity:1; stroke:rgb(1,0,0); stroke-opacity:0; stroke-width:0"/></g><text x="41.7" y="3.783332" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" text-anchor="end" dominant-baseline="central" data-original-label="6-10" style="fill:#fcc553;stroke:none;stroke-opacity:0">6-10<title>Original interval or category: 6-10</title></text><g transform="translate(42.14 3.783332) scale(1.0) translate(-2.59 -0.9)"><rect x="2.350000" y="0.760000" width="0.480000" height="0.280000" style="fill:rgb(255,206,100); fill-opacity:1; stroke:rgb(1,0,0); stroke-opacity:0; stroke-width:0"/></g><text x="41.7" y="4.241665" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" text-anchor="end" dominant-baseline="central" data-original-label="1-5" style="fill:#fcc553;stroke:none;stroke-opacity:0">1-5<title>Original interval or category: 1-5</title></text><g transform="translate(42.14 4.241665) scale(0.9999999999999999) translate(-0.54 -0.9)"><rect x="0.300000" y="0.760000" width="0.480000" height="0.280000" style="fill:rgb(255,240,188); fill-opacity:1; stroke:rgb(1,0,0); stroke-opacity:0; stroke-width:0"/></g><text x="42.38" y="4.949998" font-family="Atkinson Hyperlegible" font-size="0.19444444444444445" fill="#fcc553" text-anchor="end" style="fill:#fcc553;stroke:none;stroke-opacity:0">Strict same-calendar-day records; at least 30 years of history.</text><text x="42.38" y="5.329998" font-family="Atkinson Hyperlegible" font-size="0.19444444444444445" fill="#fcc553" text-anchor="end" style="fill:#fcc553;stroke:none;stroke-opacity:0">Blue outlines show record-low days. Partial-year counts are not annual trends.</text><text x="42.38" y="5.709998" font-family="Atkinson Hyperlegible" font-size="0.19444444444444445" fill="#fcc553" text-anchor="end" style="fill:#fcc553;stroke:none;stroke-opacity:0">Cartographic image width: 43.5 inches on a 44-inch sheet; artwork scaled proportionally to 98.863636%.</text><text x="42.38" y="6.089998" font-family="Atkinson Hyperlegible" font-size="0.19444444444444445" fill="#fcc553" text-anchor="end" style="fill:#fcc553;stroke:none;stroke-opacity:0">Japan detail includes neighboring countries; it is not a Japan-only total.</text><text x="42.38" y="6.4699979999999995" font-family="Atkinson Hyperlegible" font-size="0.19444444444444445" fill="#fcc553" text-anchor="end" style="fill:#fcc553;stroke:none;stroke-opacity:0">Yellow point: conceptual Setouchi reference (34.45°N, 133.99°E); venue unconfirmed.</text><text x="42.38" y="18.55" font-family="Atkinson Hyperlegible" font-size="0.5" fill="#fcc553" text-anchor="end" font-style="normal" id="plate-number" font-weight="700" fill-opacity="1" stroke="none" stroke-opacity="0" stroke-width="0.006944444444444444" opacity="1" style="fill:#fcc553;stroke:none;stroke-opacity:0">16</text></g><g id="plate-source-bibliography" data-plate-ordinal="16"><text x="0.8" y="0.8" font-family="Atkinson Hyperlegible" font-size="0.3888888888888889" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">Data bibliography</text><text x="0.8" y="1.28" font-family="Atkinson Hyperlegible" font-size="0.3055555555555556" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">Temperature 2026 / Japan</text><a xmlns:ns0="http://www.w3.org/1999/xlink" ns0:href="https://doi.org/10.11212/jjca.60.1_1"><text x="0.8" y="1.95" font-family="Atkinson Hyperlegible" font-size="0.2777777777777778" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">01 Hajime Narukawa — AuthaGraph formulation</text><text x="0.8" y="2.27" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">2022 formulation; native Cartofreako implementation</text><text x="0.8" y="2.59" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Projection and graticules are mathematical constructions. Horizontal periodicity supports the ST2 framing study.</text><text x="0.8" y="2.9099999999999997" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">https://doi.org/10.11212/jjca.60.1_1</text></a><a xmlns:ns1="http://www.w3.org/1999/xlink" ns1:href="https://www.naturalearthdata.com/downloads/10m-physical-vectors/"><text x="0.8" y="3.4799999999999995" font-family="Atkinson Hyperlegible" font-size="0.2777777777777778" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">02 Natural Earth — 1:10m physical vectors</text><text x="0.8" y="3.7999999999999994" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Pinned local vectors used by the 29 October 2026 delivery; not new observations</text><text x="0.8" y="4.119999999999999" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Land, coastline, minor islands, lakes, rivers, ice and generalized bathymetry. Individual version files and component</text><text x="0.8" y="4.4399999999999995" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">hashes are in the JSON ledger.</text><text x="0.8" y="4.76" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">https://www.naturalearthdata.com/downloads/10m-physical-vectors/</text><text x="0.8" y="5.08" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Attribution / use: Public domain</text></a><a xmlns:ns2="http://www.w3.org/1999/xlink" ns2:href="https://psl.noaa.gov/data/gridded/data.cpc.globaltemp.html"><text x="0.8" y="5.65" font-family="Atkinson Hyperlegible" font-size="0.2777777777777778" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">03 NOAA CPC / NOAA PSL — Global Unified Temperature V1.0</text><text x="0.8" y="5.970000000000001" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">2025 complete; 2026 through 28 October</text><text x="0.8" y="6.290000000000001" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">0.5° land TMAX/TMIN analysis aggregated to H3 resolution 5. Same-calendar-day strict records with at least 30 valid</text><text x="0.8" y="6.610000000000001" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">history years.</text><text x="0.8" y="6.9300000000000015" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">https://psl.noaa.gov/data/gridded/data.cpc.globaltemp.html</text><text x="0.8" y="7.250000000000002" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Attribution / use: No usage restrictions; NOAA PSL acknowledgment requested.</text></a><a xmlns:ns3="http://www.w3.org/1999/xlink" ns3:href="https://www.naturalearthdata.com/downloads/10m-cultural-vectors/10m-admin-0-countries/"><text x="0.8" y="7.820000000000002" font-family="Atkinson Hyperlegible" font-size="0.2777777777777778" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">04 Natural Earth — Japan geographic boundary</text><text x="0.8" y="8.140000000000002" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">1:10m boundary extracted for the 29 October 2026 delivery</text><text x="0.8" y="8.460000000000003" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Defines the Japan/Setouchi viewport. It does not turn national statistics into island-level measurements.</text><text x="0.8" y="8.780000000000003" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">https://www.naturalearthdata.com/downloads/10m-cultural-vectors/10m-admin-0-countries/</text><text x="0.8" y="9.100000000000003" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Attribution / use: Public domain</text></a><text x="0.8" y="9.670000000000003" font-family="Atkinson Hyperlegible" font-size="0.2777777777777778" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">Measure and interpretation</text><text x="0.8" y="9.990000000000004" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Days per H3 cell / 2026 through 28 October</text><text x="0.8" y="10.310000000000004" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">62,035 H3 resolution 5 land cells. Strict same-calendar-day maximum and minimum records against 1979–2025, with</text><text x="0.8" y="10.630000000000004" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">≥30 valid history years. 2026 is partial; counts are not a year-on-year warming estimate.</text><text x="0.8" y="11.200000000000005" font-family="Atkinson Hyperlegible" font-size="0.2777777777777778" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">Japan companion</text><text x="0.8" y="11.520000000000005" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Same evidence in the Japan/Setouchi geographic viewport; neighboring countries may appear. No island-level value</text><text x="0.8" y="11.840000000000005" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">is inferred.</text><a xmlns:ns4="http://www.w3.org/1999/xlink" ns4:href="https://bdekoz.github.io/cartofreako/docs/pages/gallery/setouchi-2028-bibliography.json"><text x="0.8" y="12.410000000000005" font-family="Atkinson Hyperlegible" font-size="0.2777777777777778" fill="#fcc553" font-weight="700" style="fill:#fcc553;stroke:none;stroke-opacity:0">Source ledger</text><text x="0.8" y="12.730000000000006" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">Pinned input files, complete source manifests and checksums:</text><text x="0.8" y="13.050000000000006" font-family="Atkinson Hyperlegible" font-size="0.25" fill="#fcc553" style="fill:#fcc553;stroke:none;stroke-opacity:0">https://bdekoz.github.io/cartofreako/docs/pages/gallery/setouchi-2028-bibliography.json</text></a></g><g id="h3-resolution-trial-notes"><text x=".8" y="16.1" font-family="Atkinson Hyperlegible" font-size=".20" fill="#fcc553">H3r5 resolution trial · original observation dates and sampling retained</text><text x=".8" y="16.44" font-family="Atkinson Hyperlegible" font-size=".20" fill="#fcc553">Actual H3 cell boundaries; original source-center values reaggregated directly at this resolution.</text><text x=".8" y="16.78" font-family="Atkinson Hyperlegible" font-size=".20" fill="#fcc553">Unoccupied cells have no sampled center: unobserved, not zero. Source-pixel footprints are not filled.</text><text x=".8" y="17.12" font-family="Atkinson Hyperlegible" font-size=".20" fill="#fcc553">Finer indexing adds no observations. Data layers render at 300 dpi; PDF embeds them. Outlines and type remain vector.</text><text x=".8" y="17.46" font-family="Atkinson Hyperlegible" font-size=".20" fill="#fcc553">Temperature: 0.5° CPC centers; daily spatial means precede strict record comparisons. Counts are not spatially summed.</text></g></svg>