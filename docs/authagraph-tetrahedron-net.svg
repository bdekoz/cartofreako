<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"
     role="img" aria-labelledby="title description">
  <title id="title">AuthaGraph 24-sector tetrahedral net</title>
  <desc id="description">
    A four-to-square-root-of-three rectangle assembled from twenty-four
    triangular sectors. Six sectors are colored for each of four tetrahedron
    vertices. The left and right edges are identified periodically.
  </desc>

  <style>
    .background { fill: #f8f7f3; }
    .sector { stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
    .p0 { fill: #e76f51; }
    .p1 { fill: #2a9d8f; }
    .p2 { fill: #457b9d; }
    .p3 { fill: #9b5de5; }
    .outline { fill: none; stroke: #263238; stroke-width: 2.5; }
    .seam { stroke: #263238; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .label { fill: #fff; font: 600 15px sans-serif; text-anchor: middle; }
    .heading { fill: #263238; font: 600 20px sans-serif; }
    .note { fill: #455a64; font: 15px sans-serif; }
    .legend { fill: #263238; font: 15px sans-serif; }
  </style>

  <rect class="background" width="1000" height="520" rx="8"/>
  <text class="heading" x="108" y="35">
    Periodic tetrahedral net: sector number n = 6i + s
  </text>

  <!-- i = 0, sectors 0 through 5 -->
  <polygon class="sector p0" points="499.92,64.00 401.94,233.71 303.96,177.14"/>
  <polygon class="sector p0" points="499.92,64.00 401.94,233.71 499.92,290.27"/>
  <polygon class="sector p0" points="499.92,64.00 597.90,233.71 499.92,290.27"/>
  <polygon class="sector p0" points="499.92,64.00 597.90,233.71 695.88,177.14"/>
  <polygon class="sector p0" points="499.92,64.00 695.88,64.00 695.88,177.14"/>
  <polygon class="sector p0" points="499.92,64.00 303.96,64.00 303.96,177.14"/>

  <!-- i = 1, sectors 0 through 5 -->
  <polygon class="sector p1" points="303.96,403.41 108.00,403.41 108.00,290.27"/>
  <polygon class="sector p1" points="303.96,403.41 499.92,403.41 499.92,290.27"/>
  <polygon class="sector p1" points="303.96,403.41 401.94,233.71 499.92,290.27"/>
  <polygon class="sector p1" points="303.96,403.41 401.94,233.71 303.96,177.14"/>
  <polygon class="sector p1" points="303.96,403.41 205.98,233.71 303.96,177.14"/>
  <polygon class="sector p1" points="303.96,403.41 205.98,233.71 108.00,290.27"/>

  <!-- i = 2, sectors 0 through 5 -->
  <polygon class="sector p2" points="695.88,403.41 793.86,233.71 891.84,290.27"/>
  <polygon class="sector p2" points="695.88,403.41 793.86,233.71 695.88,177.14"/>
  <polygon class="sector p2" points="695.88,403.41 597.90,233.71 695.88,177.14"/>
  <polygon class="sector p2" points="695.88,403.41 597.90,233.71 499.92,290.27"/>
  <polygon class="sector p2" points="695.88,403.41 499.92,403.41 499.92,290.27"/>
  <polygon class="sector p2" points="695.88,403.41 891.84,403.41 891.84,290.27"/>

  <!-- i = 3, sectors 0 through 5; two pairs meet across the periodic seam. -->
  <polygon class="sector p3" points="108.00,64.00 303.96,64.00 303.96,177.14"/>
  <polygon class="sector p3" points="891.84,64.00 695.88,64.00 695.88,177.14"/>
  <polygon class="sector p3" points="891.84,64.00 793.86,233.71 695.88,177.14"/>
  <polygon class="sector p3" points="891.84,64.00 793.86,233.71 891.84,290.27"/>
  <polygon class="sector p3" points="108.00,64.00 205.98,233.71 108.00,290.27"/>
  <polygon class="sector p3" points="108.00,64.00 205.98,233.71 303.96,177.14"/>

  <rect class="outline" x="108" y="64" width="783.84" height="339.41"/>
  <line class="seam" x1="108" y1="64" x2="108" y2="403.41"/>
  <line class="seam" x1="891.84" y1="64" x2="891.84" y2="403.41"/>

  <!-- Labels are global sector numbers; i=floor(n/6), s=n mod 6. -->
  <g class="label">
    <text x="401.94" y="163.28">0</text><text x="467.26" y="200.99">1</text>
    <text x="532.58" y="200.99">2</text><text x="597.90" y="163.28">3</text>
    <text x="630.56" y="106.71">4</text><text x="369.28" y="106.71">5</text>
    <text x="173.32" y="370.70">6</text><text x="434.60" y="370.70">7</text>
    <text x="401.94" y="314.13">8</text><text x="336.62" y="276.42">9</text>
    <text x="271.30" y="276.42">10</text><text x="205.98" y="314.13">11</text>
    <text x="793.86" y="314.13">12</text><text x="728.54" y="276.42">13</text>
    <text x="663.22" y="276.42">14</text><text x="597.90" y="314.13">15</text>
    <text x="565.24" y="370.70">16</text><text x="826.52" y="370.70">17</text>
    <text x="238.64" y="106.71">18</text><text x="761.20" y="106.71">19</text>
    <text x="793.86" y="163.28">20</text><text x="859.18" y="200.99">21</text>
    <text x="140.66" y="200.99">22</text><text x="205.98" y="163.28">23</text>
  </g>

  <g transform="translate(108 446)">
    <rect class="p0" width="18" height="18" rx="3"/>
    <text class="legend" x="27" y="15">i = 0</text>
    <rect class="p1" x="112" width="18" height="18" rx="3"/>
    <text class="legend" x="139" y="15">i = 1</text>
    <rect class="p2" x="224" width="18" height="18" rx="3"/>
    <text class="legend" x="251" y="15">i = 2</text>
    <rect class="p3" x="336" width="18" height="18" rx="3"/>
    <text class="legend" x="363" y="15">i = 3</text>
    <text class="note" x="495" y="15">Dashed edges are identified.</text>
  </g>
  <text class="note" x="108" y="495">
    Each color is one nearest-vertex region; each region is divided into six 60° sectors.
  </text>
</svg>
