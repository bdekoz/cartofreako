<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}

    <!-- Fetch the theme stylesheet as fast as possible, then layer the
         house-style treatment on top. -->
    <link rel="preload" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" as="style">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>

  <div class="accent-bar" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="site-nav" aria-label="Primary documentation">
      <a href="{{ '/' | relative_url }}">Cartofreako</a>
      <a href="{{ '/docs/pages/gallery/README.html' | relative_url }}">Gallery</a>
      <a href="{{ '/docs/pages/' | relative_url }}">Technical documentation</a>
      <a href="{{ '/docs/pages/getting-started/build.html' | relative_url }}">Build</a>
      <a href="{{ '/docs/pages/releases/README.html' | relative_url }}">Releases</a>
    </nav>
  </header>

  <!-- The landmark wraps where the markdown content gets injected -->
  <main>
  {{ content }}
  </main>

  <footer class="site">
    <span>cartofreako / Devastation Pacific house style</span>
    <span>GitHub Pages · {% if site.image_backend == "tot" %}top of tree{% else %}AAO{% endif %}</span>
  </footer>

</body>
</html>
