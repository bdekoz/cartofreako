# Build and deploy the Jekyll site to GitHub Pages. The image backend is read
# from .github/deploy-backend (tot or aao) so switching backends is a
# committed, reviewable file change that persists until the next edit.
name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Check documentation links
        run: make check-docs
      - name: Read deployment backend
        id: backend
        run: |
          backend=$(tr -d '[:space:]' < .github/deploy-backend)
          case "$backend" in
            aao|tot) ;;
            *) echo "invalid deploy backend: $backend" >&2; exit 1 ;;
          esac
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
      - name: Verify top-of-tree snapshot
        if: steps.backend.outputs.backend == 'tot'
        run: make check-tot-snapshot
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies
        run: bundle install
      - name: Build with Jekyll
        run: |
          if [ "${{ steps.backend.outputs.backend }}" = "aao" ]; then
            bundle exec jekyll build --config _config.yml,_config.aao.yml
          else
            bundle exec jekyll build
          fi
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check rendered site links
        run: python3 scripts/check-doc-links.py --walk _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
