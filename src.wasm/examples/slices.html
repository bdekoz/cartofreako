<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cartofreako slice example</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 2rem; }
    form { display: flex; gap: 1rem; align-items: end; flex-wrap: wrap; }
    label { display: grid; gap: .25rem; }
    canvas { display: block; margin-top: 1rem; max-width: 100%; background: #fafaf7; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Finite-carrier slice example</h1>
  <p>A slice changes the view or retained native cells. It never changes the projection frame ratio.</p>
  <form id="controls">
    <label>Projection
      <select id="projection">
        <option value="cahill-keyes">Cahill-Keyes</option>
        <option value="myriahedral">Myriahedral</option>
      </select>
    </label>
    <label>Slice
      <select id="slice"></select>
    </label>
  </form>
  <canvas id="map"></canvas>
  <pre id="metadata"></pre>
  <script type="module" src="./slices-demo.mjs"></script>
</body>
</html>
