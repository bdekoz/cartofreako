<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cartofreako browser smoke test</title>
</head>
<body>
  <main>
    <h1>Cartofreako browser smoke test</h1>
    <canvas id="map" width="440" height="248"></canvas>
    <canvas id="screen-map" width="1920" height="1080" hidden></canvas>
    <pre id="result" data-status="running">RUNNING</pre>
  </main>
  <script type="module">
    import createCartofreako from './cartofreako-web.mjs';
    import {drawCommandBuffer} from './cartofreako-canvas.mjs';
    import {
      containTransform,
      flatTexturePlane,
      projectedToScreen,
      screenToGeographic,
      screenToProjected
    } from './cartofreako-screen.mjs';
    import CartofreakoWorkerClient from './cartofreako-worker-client.mjs';

    const result = document.querySelector('#result');
    const requireCondition = (condition, message) => {
      if (!condition) throw new Error(message);
    };

    try {
      const runtime = await createCartofreako();
      requireCondition(runtime.abiVersion === 1, 'wrong ABI');
      requireCondition(runtime.apiVersion === 3, 'wrong API');
      requireCondition(new Set(runtime.manifest.map(({family}) => family)).size === 6,
        'missing projection family');
      for (const id of ['cahill-keyes', 'authagraph', 'dymaxion',
                         'myriahedral', 'star-x', 'voronoi']) {
        const descriptor = runtime.manifest.find((entry) => entry.id === id);
        const projection = runtime.createProjection({id, width: descriptor.defaultFrame.width});
        const point = projection.project(139.6917, 35.6895);
        requireCondition(Number.isFinite(point.x) && Number.isFinite(point.y),
          `${id} point is not finite`);
        const transform = containTransform(descriptor.defaultFrame);
        const screenPoint = projectedToScreen([point.x, point.y], transform);
        const projected = screenToProjected(screenPoint, transform);
        requireCondition(Math.hypot(projected[0] - point.x, projected[1] - point.y) < 1e-10,
          `${id} screen affine round trip failed`);
        const inverse = screenToGeographic(projection, screenPoint, transform, {
          nativeCell: point.nativeCell,
          component: point.component
        });
        requireCondition(inverse.candidates.length === 1,
          `${id} screen inverse pick failed`);
        requireCondition(flatTexturePlane(transform).textureCoordinates.length === 8,
          `${id} flat texture plane failed`);
        projection.dispose();
      }

      const screenCanvas = document.querySelector('#screen-map');
      const screenContext = screenCanvas.getContext('2d');
      const screenProjection = runtime.createProjection({id: 'myriahedral', width: 44, height: 24.75});
      const screenTransform = containTransform({width: 44, height: 24.75});
      screenContext.fillStyle = screenTransform.background;
      screenContext.fillRect(0, 0, 1920, 1080);
      screenContext.save();
      const screenMatrix = screenTransform.projectedToScreen;
      screenContext.setTransform(
        screenMatrix[0], screenMatrix[3], screenMatrix[1],
        screenMatrix[4], screenMatrix[2], screenMatrix[5]
      );
      drawCommandBuffer(screenContext, screenProjection.carrierGeometry(), {clear: false});
      screenContext.restore();
      requireCondition(screenCanvas.width === 1920 && screenCanvas.height === 1080,
        'screen Canvas is not exact 1080p');
      screenProjection.dispose();

      const projection = runtime.createProjection({id: 'myriahedral', width: 440});
      const forward = projection.forward([171.2, 7.1]);
      const inverse = projection.inverse([forward.x, forward.y], {
        nativeCell: forward.nativeCell
      });
      requireCondition(inverse.candidates.length === 1,
        'main-thread face-qualified inverse failed');
      requireCondition(Math.abs(inverse.candidates[0].longitude - 171.2) < 2e-8
        && Math.abs(inverse.candidates[0].latitude - 7.1) < 2e-8,
        'main-thread inverse is inaccurate');
      const geometry = projection.projectGeometry({
        type: 'Polygon',
        coordinates: [[[-10, -10], [10, -10], [10, 10], [-10, 10], [-10, -10]]]
      });
      requireCondition(geometry.partTypes.length > 0, 'main-thread geometry is empty');
      drawCommandBuffer(document.querySelector('#map').getContext('2d'), geometry);
      projection.dispose();

      const ckProjection = runtime.createProjection({id: 'cahill-keyes', width: 440});
      const ckForward = ckProjection.forward([171.2, 7.1]);
      const ckInverse = ckProjection.inverse([ckForward.x, ckForward.y], {
        nativeCell: ckForward.nativeCell
      });
      requireCondition(ckProjection.descriptor.inverseMode === 'face-qualified',
        'Cahill-Keyes reverse capability is missing');
      requireCondition(ckInverse.status === 'unique'
        && ckInverse.candidates.length === 1,
        'main-thread Cahill-Keyes inverse failed');
      requireCondition(Math.abs(ckInverse.candidates[0].longitude - 171.2) < 2e-8
        && Math.abs(ckInverse.candidates[0].latitude - 7.1) < 2e-8,
        'main-thread Cahill-Keyes inverse is inaccurate');
      ckProjection.dispose();

      const starProjection = runtime.createProjection({id: 'star-x', width: 340});
      const starForward = starProjection.forward([-66, -75]);
      requireCondition(starForward.component === 1,
        'main-thread Star-X cap component is missing');
      const starInverse = starProjection.inverse(
        [starForward.x, starForward.y],
        {nativeCell: starForward.nativeCell, component: 1}
      );
      requireCondition(starProjection.descriptor.inverseMode === 'candidates'
        && starInverse.candidates.length === 1,
        'main-thread Star-X cap inverse failed');
      requireCondition(Math.abs(starInverse.candidates[0].longitude + 66) < 2e-8
        && Math.abs(starInverse.candidates[0].latitude + 75) < 2e-8,
        'main-thread Star-X cap inverse is inaccurate');
      starProjection.dispose();

      const worker = new CartofreakoWorkerClient();
      const workerManifest = await worker.manifest();
      requireCondition(workerManifest.abiVersion === 1, 'worker ABI is wrong');
      requireCondition(workerManifest.apiVersion === 3, 'worker API is wrong');
      const workerForward = await worker.forward(
        {id: 'voronoi', width: 440},
        [171.2, 7.1]
      );
      const workerInverse = await worker.inverse(
        {id: 'voronoi', width: 440},
        [workerForward.x, workerForward.y],
        {nativeCell: workerForward.nativeCell}
      );
      requireCondition(workerInverse.candidates.length === 1,
        'worker face-qualified inverse failed');
      const workerCkForward = await worker.forward(
        {id: 'cahill-keyes', width: 440},
        [171.2, 7.1]
      );
      const workerCkInverse = await worker.inverse(
        {id: 'cahill-keyes', width: 440},
        [workerCkForward.x, workerCkForward.y],
        {nativeCell: workerCkForward.nativeCell}
      );
      requireCondition(workerCkInverse.status === 'unique'
        && workerCkInverse.candidates.length === 1,
        'worker Cahill-Keyes inverse failed');
      const workerStarForward = await worker.forward(
        {id: 'star-x', width: 340},
        [-66, -75]
      );
      const workerStarInverse = await worker.inverse(
        {id: 'star-x', width: 340},
        [workerStarForward.x, workerStarForward.y],
        {nativeCell: workerStarForward.nativeCell, component: 1}
      );
      requireCondition(workerStarForward.component === 1
        && workerStarInverse.candidates.length === 1,
        'worker Star-X cap inverse failed');
      const land = await fetch('./cartofreako-cahill-keyes-land-110m.geojson')
        .then(response => response.json());
      const workerGeometry = await worker.projectGeometry(
        {id: 'cahill-keyes', width: 440},
        land,
        {slice: 'ck-strip-1'}
      );
      requireCondition(workerGeometry.partTypes.length > 20, 'worker Natural Earth geometry is empty');
      requireCondition(workerGeometry.frame.width === 110, 'worker slice frame is wrong');
      worker.terminate();

      result.dataset.status = 'pass';
      result.textContent = `PASS API ${runtime.apiVersion}; ABI ${runtime.abiVersion}; forward/reverse; six projections; worker; Canvas 1080p; affine picking; flat texture plane; slices`;
    } catch (error) {
      result.dataset.status = 'fail';
      result.textContent = `FAIL ${error.stack ?? error}`;
    }
  </script>
</body>
</html>
